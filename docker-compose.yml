services:
  backend:
    build:
      context: ./backend
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    depends_on:
      - redis
    env_file:
      - .env
    command: >
      sh -c "
        python manage.py migrate &&
        daphne -b 0.0.0.0 -p 8000 config.asgi:application
      "

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  celery:
    build:
      context: ./backend
    command: celery -A config worker --loglevel=info
    depends_on:
      - backend
      - redis
    volumes:
      - ./backend:/app
    env_file:
      - .env
